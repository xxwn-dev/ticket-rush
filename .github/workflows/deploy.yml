name: Deploy to EC2

on:
  push:
    branches:
      - rabbitmq

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build jar
        run: ./gradlew bootJar -x test --no-daemon

      - name: Diagnose key file (non-sensitive)
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          printf '%b' "$EC2_KEY" > /tmp/ec2_key.pem
          echo "=== 파일 크기 (바이트) ==="
          wc -c < /tmp/ec2_key.pem
          echo "=== 줄 수 ==="
          wc -l < /tmp/ec2_key.pem
          echo "=== 첫 줄 (헤더만, 키 내용 아님) ==="
          head -1 /tmp/ec2_key.pem
          echo "=== 마지막 줄 (푸터만, 키 내용 아님) ==="
          tail -1 /tmp/ec2_key.pem

      - name: Upload jar and deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -o StrictHostKeyChecking=no \
            build/libs/*.jar \
            $EC2_USER@$EC2_HOST:/home/ubuntu/ticket-rush/build/libs/
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            cd /home/ubuntu/ticket-rush
            git pull
            docker build -t ticket-rush:latest .
            docker-compose -f docker-compose.prod.yaml down
            docker-compose -f docker-compose.prod.yaml up -d
          EOF
