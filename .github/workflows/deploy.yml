name: Deploy to EC2

on:
  push:
    branches:
      - rabbitmq

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build jar
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload jar and deploy to EC2
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '%b' "$EC2_KEY" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem
          scp -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no \
            build/libs/*.jar \
            $EC2_USER@$EC2_HOST:/home/ubuntu/ticket-rush/build/libs/
          ssh -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            cd /home/ubuntu/ticket-rush
            git pull
            docker build -t ticket-rush:latest .
            docker-compose -f docker-compose.prod.yaml down
            docker-compose -f docker-compose.prod.yaml up -d
          EOF
          rm /tmp/ec2_key.pem
