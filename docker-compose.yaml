services:
  # ── Redis (단일 노드, Sentinel 제거) ───────────────────────────────────
  redis:
    image: redis:latest
    container_name: ticket-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no --loglevel warning --maxmemory 100mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    networks:
      - ticket-network

  # ── RabbitMQ ───────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticket-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.15"
    mem_limit: 200m
    networks:
      - ticket-network

  # ── Spring Boot App ────────────────────────────────────────────────────
  app:
    build: .
    container_name: ticket-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/ticket_db?useSSL=true&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_sk_placeholder}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    entrypoint: ["java", "-Xmx256m", "-jar", "app.jar"]
    mem_limit: 400m
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - ticket-network


networks:
  ticket-network:
    driver: bridge
