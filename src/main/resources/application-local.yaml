# ──────────────────────────────────────────────────────────────────────────
# [local 프로파일] Mac 호스트에서 Spring Boot 직접 실행 시 사용
#
# application.yaml 이 이미 localhost:6379 직접 연결을 기본으로 사용하므로,
# 이 파일은 추가 오버라이드 없이 로컬 개발 목적으로만 활성화합니다.
#
# 실행 방법:
#   docker-compose up -d mysql redis-master rabbitmq
#   ./gradlew bootRun --args='--spring.profiles.active=local'
