port 26379

# Redis 8.x: 시작 시 hostname을 즉시 IP로 변환하지 않고 DNS 이름 그대로 사용
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# redis-master: docker-compose 내부 DNS로 마스터 접근
# quorum 2 = 3개 sentinel 중 2개가 동의해야 failover 시작
sentinel monitor mymaster redis-master 6379 2

# 5초간 응답 없으면 해당 sentinel은 마스터를 '주관적 다운'으로 판단
sentinel down-after-milliseconds mymaster 5000

# failover 시작 후 최대 10초 내에 완료해야 함
sentinel failover-timeout mymaster 10000

# 새 마스터로 동기화할 replica 동시 수 (1 = 순차 동기화, 가용성 유지)
sentinel parallel-syncs mymaster 1
